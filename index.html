    });

    // Insertar el botón en el contenedor superior visible
    table.buttons().container().appendTo('#contenedor-botones');

    // Filtros directos y estables
    $('#sel_nombre').on('change', function() {
        const val = $(this).val();
        table.column(3).search(val ? val : '', false, false).draw();
    });

    $('#sel_fecha').on('change', function() {
        const val = $(this).val();
        table.column(4).search(val ? val : '', false, false).draw();
    });

    $('#sel_visitas_poc').on('change', function() {
        const val = $(this).val();
        table.column(5).search(val ? val : '', false, false).draw();
    });

    $('#sel_estado').on('change', function() {
        const val = $(this).val();
        table.column(6).search(val ? val : '', false, false).draw();
    });
});
</script>
</body>
</html>
