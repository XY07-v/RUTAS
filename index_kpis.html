<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de KPIs - ManpowerGroup & Nestlé</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --mp-blue-dark: #4A60A1;
            --mp-blue-light: #6C85C6;
            --mp-green: #6B9080;
            --mp-rose: #A54B55;
            --mp-orange: #D98A38;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            --border-color: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* ================= PANTALLA DE LOGIN ================= */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #1e293b 0%, #3d5088 100%);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.4s ease, visibility 0.4s;
        }

        .login-card {
            background: #ffffff; width: 100%; max-width: 400px;
            padding: 36px 30px; border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2); animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo Vectorial Corregido */
        .login-logo-svg {
            width: 140px; height: auto; margin-bottom: 16px;
        }

        .login-title {
            font-size: 20px; font-weight: 800; color: var(--mp-blue-dark);
            margin-bottom: 6px; letter-spacing: -0.3px;
        }

        .login-subtitle {
            font-size: 13px; color: var(--text-muted); font-weight: 500; margin-bottom: 24px;
        }

        .login-input-group {
            display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px;
        }

        .login-input {
            width: 100%; padding: 12px 16px; border-radius: 10px;
            border: 2px solid var(--border-color); font-size: 15px; text-align: center;
            font-weight: 700; letter-spacing: 2px; outline: none; transition: border-color 0.2s;
        }

        .login-input:focus {
            border-color: var(--mp-blue-dark); box-shadow: 0 0 0 3px rgba(74, 96, 161, 0.15);
        }

        .btn-login {
            background: linear-gradient(135deg, #4A60A1 0%, #3d5088 100%);
            color: #ffffff; border: none; padding: 12px 20px; border-radius: 10px;
            font-size: 14px; font-weight: 800; cursor: pointer; transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(74, 96, 161, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px); box-shadow: 0 6px 16px rgba(74, 96, 161, 0.4);
        }

        .login-error {
            color: #b91c1c; font-size: 12px; font-weight: 700;
            display: none; margin-top: 10px; animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        /* ================= DASHBOARD MAIN ================= */
        #dashboard-app {
            display: none; padding: 20px;
        }

        /* Header Principal */
        .top-header {
            background: linear-gradient(135deg, #3d5088 0%, #4A60A1 25%, #6C85C6 50%, #6B9080 75%, #A54B55 90%, #D98A38 100%);
            border-radius: 16px; padding: 14px 28px; display: flex;
            align-items: center; justify-content: space-between; color: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15); margin-bottom: 16px;
        }

        .brand-box { display: flex; align-items: center; gap: 16px; }
        .header-logo-svg { width: 55px; height: auto; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.3)); }
        .header-title { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }

        .header-actions { display: flex; gap: 10px; align-items: center; }

        .btn-download {
            background: #ffffff; color: var(--mp-blue-dark); border: none;
            padding: 9px 18px; border-radius: 20px; font-weight: 800;
            font-size: 13px; cursor: pointer; display: flex; align-items: center;
            gap: 8px; box-shadow: 0 3px 10px rgba(0,0,0,0.15); transition: all 0.2s ease;
        }
        .btn-download:hover { transform: translateY(-2px); background: #f1f5f9; }

        .btn-logout {
            background: rgba(255, 255, 255, 0.2); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 9px 14px; border-radius: 20px; font-weight: 700;
            font-size: 12px; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-logout:hover { background: rgba(255, 255, 255, 0.35); }

        /* PESTAÑAS */
        .main-tabs { display: flex; gap: 10px; margin-bottom: 16px; }
        .tab-btn {
            background: #ffffff; border: 1px solid var(--border-color); padding: 10px 22px;
            border-radius: 10px; font-weight: 800; font-size: 13px; color: var(--mp-blue-dark);
            cursor: pointer; transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--mp-blue-dark); color: #ffffff; border-color: var(--mp-blue-dark);
            box-shadow: 0 4px 12px rgba(74, 96, 161, 0.3);
        }

        /* Filtros */
        .filters-bar {
            background: #ffffff; border-radius: 14px; padding: 16px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;
            margin-bottom: 20px; box-shadow: var(--shadow); align-items: flex-end; border: 1px solid var(--border-color);
        }

        .filter-item { display: flex; flex-direction: column; gap: 4px; position: relative; }
        .filter-label { font-size: 10px; font-weight: 800; color: var(--mp-blue-dark); text-transform: uppercase; }
        .filter-control {
            width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-color);
            background: #f8fafc; font-size: 12px; font-weight: 600; color: var(--text-main); outline: none;
        }

        /* Multiselect personalizado */
        .multiselect-container { position: relative; width: 100%; }
        .multiselect-button {
            width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-color);
            background: #f8fafc; font-size: 12px; font-weight: 600; color: var(--text-main);
            text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
        }
        .multiselect-dropdown {
            display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 100;
            background: #ffffff; border: 1px solid var(--border-color); border-radius: 8px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15); max-height: 220px; overflow-y: auto; padding: 6px;
        }
        .multiselect-dropdown.show { display: block; }
        .multiselect-item {
            display: flex; align-items: center; gap: 8px; padding: 6px 8px; font-size: 12px;
            cursor: pointer; border-radius: 4px; font-weight: 600;
        }
        .multiselect-item:hover { background: #f1f5f9; }

        .btn-reset-filters {
            background: #f1f5f9; border: 1px solid #cbd5e1; padding: 8px 12px; border-radius: 8px;
            font-size: 12px; font-weight: 800; color: var(--mp-blue-dark); cursor: pointer; height: 35px;
        }

        /* Tarjetas Resumen */
        .kpi-cards-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px;
        }

        .kpi-card-summary {
            background: #ffffff; border-radius: 12px; padding: 14px; box-shadow: var(--shadow);
            border-left: 5px solid var(--mp-blue-dark); display: flex; flex-direction: column; gap: 4px; border: 1px solid #e2e8f0;
        }

        .kpi-card-title { font-size: 11px; font-weight: 800; color: var(--text-muted); }
        .kpi-card-val { font-size: 16px; font-weight: 800; color: var(--mp-blue-dark); }
        .kpi-badge {
            align-self: flex-start; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; margin-top: 4px;
        }
        .badge-green { background: #dcfce7; color: #15803d; }
        .badge-yellow { background: #fef9c3; color: #a16207; }
        .badge-red { background: #fee2e2; color: #b91c1c; }

        /* Tablas */
        .view-section { display: none; }
        .view-section.active { display: block; }

        .table-container {
            background: #ffffff; border-radius: 14px; padding: 16px;
            box-shadow: var(--shadow); overflow-x: auto; border: 1px solid var(--border-color);
        }

        table.kpi-table { width: 100%; border-collapse: collapse; min-width: 950px; }
        table.kpi-table th, table.kpi-table td {
            padding: 8px 10px; text-align: center; font-size: 12px; border: 1px solid var(--border-color);
        }

        .th-main { background: var(--mp-blue-dark); color: #ffffff; font-weight: 800; font-size: 12px; }
        .th-summary { background: #3d5088; color: #ffffff; font-weight: 800; font-size: 12px; }

        .td-sticky {
            text-align: left !important; font-weight: 700; color: var(--mp-blue-dark); background: #f8fafc;
            position: sticky; left: 0; z-index: 2; min-width: 160px;
        }
        .td-sticky-2 {
            text-align: left !important; font-weight: 700; color: var(--text-main); background: #f8fafc;
            position: sticky; left: 160px; z-index: 2; min-width: 140px;
        }

        .cumpl-val { font-weight: 800; padding: 3px 6px; border-radius: 4px; display: inline-block; width: 100%; }
        .empty-msg { text-align: center; padding: 40px; color: var(--text-muted); font-weight: 600; font-size: 13px; }
    </style>
</head>
<body>

    <!-- PANTALLA DE CONTROL DE ACCESO (LOGIN) -->
    <div id="login-overlay">
        <div class="login-card">
            <!-- Logo Vectorial Fiel ManpowerGroup -->
            <svg class="login-logo-svg" viewBox="0 0 250 140" xmlns="http://www.w3.org/2000/svg">
                <g transform="skewX(-18)">
                    <rect x="35" y="25" width="22" height="90" rx="11" fill="#4A60A1"/>
                    <rect x="70" y="25" width="22" height="90" rx="11" fill="#6C85C6"/>
                    <rect x="105" y="25" width="22" height="90" rx="11" fill="#6B9080"/>
                    <rect x="140" y="10" width="22" height="115" rx="11" fill="#A54B55"/>
                    <rect x="175" y="10" width="22" height="65" rx="11" fill="#D98A38"/>
                </g>
            </svg>
            <h2 class="login-title">Control de KPIs</h2>
            <p class="login-subtitle">ManpowerGroup & Nestlé</p>
            
            <div class="login-input-group">
                <input type="password" id="login-pass" class="login-input" placeholder="••••" maxlength="10" onkeydown="if(event.key==='Enter') checkPassword()">
                <button class="btn-login" onclick="checkPassword()">Ingresar al Sistema</button>
            </div>
            <div id="login-err-msg" class="login-error">⚠️ Contraseña incorrecta. Intente de nuevo.</div>
        </div>
    </div>

    <!-- DASHBOARD PRINCIPAL -->
    <div id="dashboard-app">
        <header class="top-header">
            <div class="brand-box">
                <!-- Logo Vectorial Blanco en Banner Header -->
                <svg class="header-logo-svg" viewBox="0 0 250 140" xmlns="http://www.w3.org/2000/svg">
                    <g transform="skewX(-18)">
                        <rect x="35" y="25" width="22" height="90" rx="11" fill="#ffffff" opacity="0.9"/>
                        <rect x="70" y="25" width="22" height="90" rx="11" fill="#ffffff" opacity="0.85"/>
                        <rect x="105" y="25" width="22" height="90" rx="11" fill="#ffffff" opacity="0.8"/>
                        <rect x="140" y="10" width="22" height="115" rx="11" fill="#ffffff" opacity="0.95"/>
                        <rect x="175" y="10" width="22" height="65" rx="11" fill="#ffffff" opacity="1.0"/>
                    </g>
                </svg>
                <h1 class="header-title">Control de KPIs – ManpowerGroup & Nestlé</h1>
            </div>
            <div class="header-actions">
                <button class="btn-download" onclick="downloadExcel()">📥 Descargar Datos</button>
                <button class="btn-logout" onclick="logout()">🔒 Salir</button>
            </div>
        </header>

        <div class="main-tabs">
            <button class="tab-btn active" id="tab-dev" onclick="switchView('dev')">👤 Vista por Desarrollador</button>
            <button class="tab-btn" id="tab-mes" onclick="switchView('mes')">📅 Evolución Mensual por Regional</button>
        </div>

        <div class="filters-bar">
            <div class="filter-item">
                <label class="filter-label">Regional</label>
                <select id="f-regional" class="filter-control" onchange="onFilterChange('regional')"><option value="">Todas</option></select>
            </div>
            <div class="filter-item">
                <label class="filter-label">Cargo</label>
                <select id="f-cargo" class="filter-control" onchange="onFilterChange('cargo')"><option value="">Todos</option></select>
            </div>
            <div class="filter-item">
                <label class="filter-label">Desarrollador</label>
                <select id="f-desarrollador" class="filter-control" onchange="onFilterChange('desarrollador')"><option value="">Todos</option></select>
            </div>
            <div class="filter-item">
                <label class="filter-label">Año</label>
                <select id="f-anio" class="filter-control" onchange="onFilterChange('anio')"><option value="">Todos</option></select>
            </div>
            
            <!-- Filtro Multiselect para Meses -->
            <div class="filter-item">
                <label class="filter-label">Meses</label>
                <div class="multiselect-container">
                    <button type="button" class="multiselect-button" id="meses-btn" onclick="toggleDropdown('meses-dropdown')">
                        <span id="meses-btn-label">Seleccionar</span> ▾
                    </button>
                    <div class="multiselect-dropdown" id="meses-dropdown"></div>
                </div>
            </div>

            <!-- Filtro Multiselect para KPIs -->
            <div class="filter-item">
                <label class="filter-label">KPIs</label>
                <div class="multiselect-container">
                    <button type="button" class="multiselect-button" id="kpis-btn" onclick="toggleDropdown('kpis-dropdown')">
                        <span id="kpis-btn-label">Todos los KPIs</span> ▾
                    </button>
                    <div class="multiselect-dropdown" id="kpis-dropdown"></div>
                </div>
            </div>

            <button class="btn-reset-filters" onclick="resetFilters()">Limpiar Filtros</button>
        </div>

        <div class="kpi-cards-grid" id="kpi-summary-cards"></div>

        <!-- VISTA 1: POR DESARROLLADOR -->
        <div id="sec-dev" class="view-section active">
            <div class="table-container">
                <table class="kpi-table">
                    <thead id="dev-head"></thead>
                    <tbody id="dev-body"></tbody>
                </table>
            </div>
        </div>

        <!-- VISTA 2: EVOLUCIÓN MENSUAL POR REGIONAL -->
        <div id="sec-mes" class="view-section">
            <div class="table-container">
                <table class="kpi-table">
                    <thead id="mes-head"></thead>
                    <tbody id="mes-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // CONTRASEÑA DE ACCESO
        const PASS_CORRECT = "2184";

        function checkPassword() {
            const inputPass = document.getElementById('login-pass').value;
            const errMsg = document.getElementById('login-err-msg');
            
            if (inputPass === PASS_CORRECT) {
                sessionStorage.setItem("kpi_auth", "true");
                showDashboard();
            } else {
                errMsg.style.display = "block";
                document.getElementById('login-pass').value = "";
                document.getElementById('login-pass').focus();
            }
        }

        function showDashboard() {
            const overlay = document.getElementById('login-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                document.getElementById('dashboard-app').style.display = 'block';
                initApp();
            }, 300);
        }

        function logout() {
            sessionStorage.removeItem("kpi_auth");
            location.reload();
        }

        // Verificar autenticación previa
        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem("kpi_auth") === "true") {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('dashboard-app').style.display = 'block';
                initApp();
            } else {
                document.getElementById('login-pass').focus();
            }
        });

        const MESES_ORDEN = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        const KPI_ORDER = ["instalaciones", "retiros", "netas", "sell in", "sell out", "zona de muerte"];

        function toTitleCase(str) {
            if (!str) return "";
            return str.toLowerCase().split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        }

        function getValue(item, keys) {
            for (let k of keys) {
                const foundKey = Object.keys(item).find(key => key.trim().toLowerCase() === k.trim().toLowerCase());
                if (foundKey && item[foundKey] !== undefined && item[foundKey] !== null && String(item[foundKey]).trim() !== "") {
                    return String(item[foundKey]).trim();
                }
            }
            return "";
        }

        function getNumValue(item, keys) {
            const val = getValue(item, keys);
            if (!val) return 0;
            const cleaned = val.replace(/[^0-9.-]+/g, "");
            return parseFloat(cleaned) || 0;
        }

        const KEYS = {
            regional: ["Regional", "REGIONAL"],
            cargo: ["Cargo", "CARGO"],
            desarrollador: ["Desarrollador", "DESARROLLADOR", "Nombre Desarrollador"],
            anio: ["Año", "ANIO", "AÑO", "Anio"],
            mes: ["Mes", "MES"],
            kpi: ["KPI", "Kpi", "kpi"],
            cuota: ["Cuota", "CUOTA"],
            ejecutado: ["Ejecutado", "EJECUTADO"],
            cumplimiento: ["Cumplimiento", "CUMPLIMIENTO", "% Cumplimiento"]
        };

        function sortKPIs(kpiList) {
            return kpiList.sort((a, b) => {
                let idxA = KPI_ORDER.findIndex(k => a.toLowerCase().includes(k));
                let idxB = KPI_ORDER.findIndex(k => b.toLowerCase().includes(k));
                if (idxA === -1) idxA = 99;
                if (idxB === -1) idxB = 99;
                return idxA - idxB || a.localeCompare(b);
            });
        }

        function switchView(tab) {
            activeTab = tab;
            document.getElementById('tab-dev').classList.toggle('active', tab === 'dev');
            document.getElementById('tab-mes').classList.toggle('active', tab === 'mes');
            document.getElementById('sec-dev').classList.toggle('active', tab === 'dev');
            document.getElementById('sec-mes').classList.toggle('active', tab === 'mes');
        }

        function toggleDropdown(id) {
            const target = document.getElementById(id);
            const isShown = target.classList.contains('show');
            document.querySelectorAll('.multiselect-dropdown').forEach(d => d.classList.remove('show'));
            if (!isShown) target.classList.add('show');
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.multiselect-container')) {
                document.querySelectorAll('.multiselect-dropdown').forEach(d => d.classList.remove('show'));
            }
        });

        function renderMesesDropdown() {
            const dropdown = document.getElementById('meses-dropdown');
            dropdown.innerHTML = '';

            const uniqueMeses = Array.from(new Set(rawData.map(d => getValue(d, KEYS.mes)))).filter(Boolean);
            uniqueMeses.sort((a, b) => MESES_ORDEN.indexOf(toTitleCase(a)) - MESES_ORDEN.indexOf(toTitleCase(b)));

            const allLabel = document.createElement('label');
            allLabel.className = 'multiselect-item';
            allLabel.style.fontWeight = 'bold';
            allLabel.style.borderBottom = '1px solid #e2e8f0';
            allLabel.innerHTML = `<input type="checkbox" id="chk-all-meses" onchange="toggleAllMeses(this)"> (Todos los meses)`;
            dropdown.appendChild(allLabel);

            uniqueMeses.forEach(m => {
                const lbl = document.createElement('label');
                lbl.className = 'multiselect-item';
                const isChecked = selectedMeses.includes(m.toLowerCase());
                lbl.innerHTML = `<input type="checkbox" class="chk-mes" value="${m}" ${isChecked ? 'checked' : ''} onchange="onMesCheckboxChange()"> ${toTitleCase(m)}`;
                dropdown.appendChild(lbl);
            });
        }

        function toggleAllMeses(masterChk) {
            const checkboxes = document.querySelectorAll('.chk-mes');
            selectedMeses = [];
            checkboxes.forEach(chk => {
                chk.checked = masterChk.checked;
                if (masterChk.checked) selectedMeses.push(chk.value.toLowerCase());
            });
            updateMesesBtnLabel();
            onFilterChange('mes');
        }

        function onMesCheckboxChange() {
            const checkboxes = document.querySelectorAll('.chk-mes');
            selectedMeses = [];
            checkboxes.forEach(chk => {
                if (chk.checked) selectedMeses.push(chk.value.toLowerCase());
            });
            const allChk = document.getElementById('chk-all-meses');
            if (allChk) allChk.checked = selectedMeses.length === checkboxes.length;
            updateMesesBtnLabel();
            onFilterChange('mes');
        }

        function updateMesesBtnLabel() {
            const btnLabel = document.getElementById('meses-btn-label');
            const total = document.querySelectorAll('.chk-mes').length;
            if (selectedMeses.length === 0) {
                btnLabel.textContent = "Ningún mes";
            } else if (selectedMeses.length === total && total > 0) {
                btnLabel.textContent = "Todos los meses";
            } else if (selectedMeses.length === 1) {
                btnLabel.textContent = toTitleCase(selectedMeses[0]);
            } else {
                btnLabel.textContent = `${selectedMeses.length} meses seleccionados`;
            }
        }

        function renderKPIsDropdown() {
            const dropdown = document.getElementById('kpis-dropdown');
            dropdown.innerHTML = '';

            const uniqueKPIs = sortKPIs(Array.from(new Set(rawData.map(d => getValue(d, KEYS.kpi)))).filter(Boolean));

            const allLabel = document.createElement('label');
            allLabel.className = 'multiselect-item';
            allLabel.style.fontWeight = 'bold';
            allLabel.style.borderBottom = '1px solid #e2e8f0';
            allLabel.innerHTML = `<input type="checkbox" id="chk-all-kpis" onchange="toggleAllKPIs(this)"> (Todos los KPIs)`;
            dropdown.appendChild(allLabel);

            uniqueKPIs.forEach(k => {
                const lbl = document.createElement('label');
                lbl.className = 'multiselect-item';
                const isChecked = selectedKPIs.includes(k.toLowerCase());
                lbl.innerHTML = `<input type="checkbox" class="chk-kpi" value="${k}" ${isChecked ? 'checked' : ''} onchange="onKPICheckboxChange()"> ${toTitleCase(k)}`;
                dropdown.appendChild(lbl);
            });
        }

        function toggleAllKPIs(masterChk) {
            const checkboxes = document.querySelectorAll('.chk-kpi');
            selectedKPIs = [];
            checkboxes.forEach(chk => {
                chk.checked = masterChk.checked;
                if (masterChk.checked) selectedKPIs.push(chk.value.toLowerCase());
            });
            updateKPIsBtnLabel();
            onFilterChange('kpi');
        }

        function onKPICheckboxChange() {
            const checkboxes = document.querySelectorAll('.chk-kpi');
            selectedKPIs = [];
            checkboxes.forEach(chk => {
                if (chk.checked) selectedKPIs.push(chk.value.toLowerCase());
            });
            const allChk = document.getElementById('chk-all-kpis');
            if (allChk) allChk.checked = selectedKPIs.length === checkboxes.length;
            updateKPIsBtnLabel();
            onFilterChange('kpi');
        }

        function updateKPIsBtnLabel() {
            const btnLabel = document.getElementById('kpis-btn-label');
            const total = document.querySelectorAll('.chk-kpi').length;
            if (selectedKPIs.length === 0) {
                btnLabel.textContent = "Ningún KPI";
            } else if (selectedKPIs.length === total && total > 0) {
                btnLabel.textContent = "Todos los KPIs";
            } else if (selectedKPIs.length === 1) {
                btnLabel.textContent = toTitleCase(selectedKPIs[0]);
            } else {
                btnLabel.textContent = `${selectedKPIs.length} KPIs seleccionados`;
            }
        }

        function updateAllSelects(changedField = null) {
            const currentFilters = {
                regional: document.getElementById('f-regional').value,
                cargo: document.getElementById('f-cargo').value,
                desarrollador: document.getElementById('f-desarrollador').value,
                anio: document.getElementById('f-anio').value
            };

            const fields = ['regional', 'cargo', 'desarrollador', 'anio'];

            fields.forEach(field => {
                if (field === changedField) return;

                const subset = rawData.filter(item => {
                    if (currentFilters.regional && field !== 'regional' && getValue(item, KEYS.regional).toLowerCase() !== currentFilters.regional.toLowerCase()) return false;
                    if (currentFilters.cargo && field !== 'cargo' && getValue(item, KEYS.cargo).toLowerCase() !== currentFilters.cargo.toLowerCase()) return false;
                    if (currentFilters.desarrollador && field !== 'desarrollador' && getValue(item, KEYS.desarrollador).toLowerCase() !== currentFilters.desarrollador.toLowerCase()) return false;
                    if (currentFilters.anio && field !== 'anio' && getValue(item, KEYS.anio).toLowerCase() !== currentFilters.anio.toLowerCase()) return false;
                    if (selectedMeses.length > 0 && !selectedMeses.includes(getValue(item, KEYS.mes).toLowerCase())) return false;
                    if (selectedKPIs.length > 0 && !selectedKPIs.includes(getValue(item, KEYS.kpi).toLowerCase())) return false;
                    return true;
                });

                const select = document.getElementById('f-' + field);
                const currentVal = select.value;
                select.innerHTML = '<option value="">' + (field === 'regional' ? 'Todas' : 'Todos') + '</option>';

                const set = new Set();
                subset.forEach(item => {
                    const val = getValue(item, KEYS[field]);
                    if (val) set.add(val);
                });

                let arr = Array.from(set).sort();
                arr.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v; 
                    opt.textContent = toTitleCase(v);
                    select.appendChild(opt);
                });

                select.value = currentVal;
            });
        }

        function setSmartDefaultFilters() {
            const now = new Date();
            const currentYearStr = String(now.getFullYear());
            const selectAnio = document.getElementById('f-anio');
            
            if (Array.from(selectAnio.options).some(opt => opt.value === currentYearStr)) {
                selectAnio.value = currentYearStr;
            } else if (selectAnio.options.length > 1) {
                selectAnio.selectedIndex = selectAnio.options.length - 1;
            }

            let targetMonthIdx = now.getMonth() - 1;
            if (targetMonthIdx < 0) targetMonthIdx = 11;

            const uniqueMeses = Array.from(new Set(rawData.map(d => getValue(d, KEYS.mes)))).filter(Boolean);
            let foundMes = "";

            for (let i = 0; i < 12; i++) {
                let checkIdx = (targetMonthIdx - i + 12) % 12;
                let candidateMesName = MESES_ORDEN[checkIdx];
                let exists = uniqueMeses.some(m => m.toLowerCase() === candidateMesName.toLowerCase());
                if (exists) {
                    foundMes = candidateMesName.toLowerCase();
                    break;
                }
            }

            selectedMeses = foundMes ? [foundMes] : uniqueMeses.map(m => m.toLowerCase());
            renderMesesDropdown();
            updateMesesBtnLabel();

            const uniqueKPIs = Array.from(new Set(rawData.map(d => getValue(d, KEYS.kpi)))).filter(Boolean);
            selectedKPIs = uniqueKPIs.map(k => k.toLowerCase());
            renderKPIsDropdown();
            const chkAllKPIs = document.getElementById('chk-all-kpis');
            if (chkAllKPIs) chkAllKPIs.checked = true;
            updateKPIsBtnLabel();
        }

        function getFilteredData() {
            const reg = document.getElementById('f-regional').value;
            const car = document.getElementById('f-cargo').value;
            const dev = document.getElementById('f-desarrollador').value;
            const anio = document.getElementById('f-anio').value;

            return rawData.filter(item => {
                if (reg && getValue(item, KEYS.regional).toLowerCase() !== reg.toLowerCase()) return false;
                if (car && getValue(item, KEYS.cargo).toLowerCase() !== car.toLowerCase()) return false;
                if (dev && getValue(item, KEYS.desarrollador).toLowerCase() !== dev.toLowerCase()) return false;
                if (anio && getValue(item, KEYS.anio).toLowerCase() !== anio.toLowerCase()) return false;
                if (selectedMeses.length > 0 && !selectedMeses.includes(getValue(item, KEYS.mes).toLowerCase())) return false;
                if (selectedKPIs.length > 0 && !selectedKPIs.includes(getValue(item, KEYS.kpi).toLowerCase())) return false;
                return true;
            });
        }

        // APLICADO SELL IN Y SELL OUT COMO MONEDA ($)
        function formatValue(val, kpiName, type = 'num') {
            const name = (kpiName || "").toLowerCase();
            if (type === 'cumpl') {
                const pct = val <= 2 && val > 0 ? val * 100 : val;
                return pct.toFixed(1) + "%";
            }
            if (name.includes("sell out") || name.includes("sell in")) return "$" + Math.round(val).toLocaleString("es-CO");
            if (name.includes("zona de muerte")) return (val <= 2 && val > 0 ? val * 100 : val).toFixed(1) + "%";
            return Number.isInteger(val) ? val.toLocaleString("es-CO") : val.toFixed(1);
        }

        function getCumplBadgeClass(pctVal, kpiName = "") {
            const pct = pctVal <= 2 && pctVal > 0 ? pctVal * 100 : pctVal;
            const name = (kpiName || "").toLowerCase();
            const isInverse = name.includes("zona de muerte") || name.includes("retiro");

            if (isInverse) {
                if (pct <= 100) return 'badge-green';
                if (pct <= 110) return 'badge-yellow';
                return 'badge-red';
            } else {
                if (pct >= 100) return 'badge-green';
                if (pct >= 90) return 'badge-yellow';
                return 'badge-red';
            }
        }

        function onFilterChange(changedField = null) {
            updateAllSelects(changedField);
            const filteredData = getFilteredData();
            renderSummaryCards(filteredData);
            renderDevMatrix(filteredData);
            renderMesMatrix(filteredData);
        }

        function renderSummaryCards(data) {
            const container = document.getElementById('kpi-summary-cards');
            container.innerHTML = '';

            const kpiTotals = {};
            data.forEach(item => {
                const kpi = getValue(item, KEYS.kpi) || "General";
                if (!kpiTotals[kpi]) kpiTotals[kpi] = { cuota: 0, ejecutado: 0, count: 0 };
                kpiTotals[kpi].cuota += getNumValue(item, KEYS.cuota);
                kpiTotals[kpi].ejecutado += getNumValue(item, KEYS.ejecutado);
                kpiTotals[kpi].count += 1;
            });

            sortKPIs(Object.keys(kpiTotals)).forEach(kpiKey => {
                const t = kpiTotals[kpiKey];
                const isZonaMuerte = kpiKey.toLowerCase().includes("zona de muerte");
                let displayEjec = isZonaMuerte && t.count > 0 ? t.ejecutado / t.count : t.ejecutado;
                let displayCuota = isZonaMuerte && t.count > 0 ? t.cuota / t.count : t.cuota;

                const cumpl = displayCuota > 0 ? (displayEjec / displayCuota) * 100 : 0;
                const badgeClass = getCumplBadgeClass(cumpl, kpiKey);

                const card = document.createElement('div');
                card.className = 'kpi-card-summary';
                card.innerHTML = `
                    <div class="kpi-card-title">${toTitleCase(kpiKey)}</div>
                    <div class="kpi-card-val">${formatValue(displayEjec, kpiKey)} <span style="font-size:11px; color:var(--text-muted);">/ ${formatValue(displayCuota, kpiKey)}</span></div>
                    <div class="kpi-badge ${badgeClass}">Cumplimiento: ${cumpl.toFixed(1)}%</div>
                `;
                container.appendChild(card);
            });
        }

        function renderDevMatrix(data) {
            const thead = document.getElementById('dev-head');
            const tbody = document.getElementById('dev-body');
            thead.innerHTML = ''; tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="100" class="empty-msg">❌ No hay registros para la combinación de filtros.</td></tr>';
                return;
            }

            const kpis = sortKPIs(Array.from(new Set(data.map(d => getValue(d, KEYS.kpi)))).filter(Boolean));
            const devs = Array.from(new Set(data.map(d => getValue(d, KEYS.desarrollador)))).filter(Boolean).sort();

            let tr1 = `<tr><th rowspan="2" class="th-main td-sticky">Desarrollador</th>`;
            let tr2 = `<tr>`;

            kpis.forEach(kpi => {
                tr1 += `<th colspan="3" class="th-main">${toTitleCase(kpi)}</th>`;
                tr2 += `<th class="th-sub-icon" title="Cuota">🎯</th><th class="th-sub-icon" title="Ejecutado">📊</th><th class="th-sub-icon" title="Cumplimiento">✅</th>`;
            });

            thead.innerHTML = tr1 + `</tr>` + tr2 + `</tr>`;

            const map = {};
            data.forEach(item => {
                const dev = getValue(item, KEYS.desarrollador);
                const kpi = getValue(item, KEYS.kpi);
                if (!map[dev]) map[dev] = {};
                if (!map[dev][kpi]) map[dev][kpi] = { cuota: 0, ejecutado: 0 };
                map[dev][kpi].cuota += getNumValue(item, KEYS.cuota);
                map[dev][kpi].ejecutado += getNumValue(item, KEYS.ejecutado);
            });

            devs.forEach(dev => {
                let row = `<tr><td class="td-sticky">${toTitleCase(dev)}</td>`;
                kpis.forEach(kpi => {
                    const cell = map[dev] && map[dev][kpi] ? map[dev][kpi] : null;
                    if (cell) {
                        const cumplPct = cell.cuota > 0 ? (cell.ejecutado / cell.cuota) * 100 : 0;
                        row += `
                            <td>${formatValue(cell.cuota, kpi)}</td>
                            <td>${formatValue(cell.ejecutado, kpi)}</td>
                            <td><span class="cumpl-val ${getCumplBadgeClass(cumplPct, kpi)}">${formatValue(cumplPct, kpi, 'cumpl')}</span></td>
                        `;
                    } else { row += `<td>-</td><td>-</td><td>-</td>`; }
                });
                tbody.innerHTML += row + `</tr>`;
            });
        }

        function renderMesMatrix(data) {
            const thead = document.getElementById('mes-head');
            const tbody = document.getElementById('mes-body');
            thead.innerHTML = ''; tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="100" class="empty-msg">❌ No hay datos de evolución.</td></tr>';
                return;
            }

            const regionals = Array.from(new Set(data.map(d => getValue(d, KEYS.regional)))).filter(Boolean).sort();
            const kpis = sortKPIs(Array.from(new Set(data.map(d => getValue(d, KEYS.kpi)))).filter(Boolean));
            const mesesFound = Array.from(new Set(data.map(d => getValue(d, KEYS.mes)))).filter(Boolean);
            mesesFound.sort((a, b) => MESES_ORDEN.indexOf(toTitleCase(a)) - MESES_ORDEN.indexOf(toTitleCase(b)));

            let tr = `
                <tr>
                    <th class="th-main td-sticky">Regional</th>
                    <th class="th-main td-sticky-2">Indicador / KPI</th>
                    <th class="th-summary">🎯 Cuota Total</th>
                    <th class="th-summary">📊 Ejec. Total</th>
                    <th class="th-summary">✅ % Cumpl. Total</th>
            `;
            mesesFound.forEach(m => { tr += `<th class="th-main">${toTitleCase(m)}</th>`; });
            thead.innerHTML = tr + `</tr>`;

            const map = {};

            data.forEach(item => {
                const reg = getValue(item, KEYS.regional);
                const kpi = getValue(item, KEYS.kpi);
                const mes = getValue(item, KEYS.mes);

                if (!map[reg]) map[reg] = {};
                if (!map[reg][kpi]) map[reg][kpi] = { cuotaTot: 0, ejecTot: 0, countTot: 0, meses: {} };
                if (!map[reg][kpi].meses[mes]) map[reg][kpi].meses[mes] = { cuota: 0, ejecutado: 0 };

                const c = getNumValue(item, KEYS.cuota);
                const e = getNumValue(item, KEYS.ejecutado);

                map[reg][kpi].cuotaTot += c;
                map[reg][kpi].ejecTot += e;
                map[reg][kpi].countTot += 1;

                map[reg][kpi].meses[mes].cuota += c;
                map[reg][kpi].meses[mes].ejecutado += e;
            });

            regionals.forEach(reg => {
                let regSpan = kpis.length;
                
                kpis.forEach((kpi, idx) => {
                    let row = `<tr>`;
                    if (idx === 0) {
                        row += `<td class="td-sticky" rowspan="${regSpan}">${toTitleCase(reg)}</td>`;
                    }
                    row += `<td class="td-sticky-2">${toTitleCase(kpi)}</td>`;

                    const kpiData = map[reg] && map[reg][kpi] ? map[reg][kpi] : null;
                    if (kpiData) {
                        const isZonaMuerte = kpi.toLowerCase().includes("zona de muerte");
                        let totalCuotaDisplay = isZonaMuerte && kpiData.countTot > 0 ? kpiData.cuotaTot / kpiData.countTot : kpiData.cuotaTot;
                        let totalEjecDisplay = isZonaMuerte && kpiData.countTot > 0 ? kpiData.ejecTot / kpiData.countTot : kpiData.ejecTot;
                        let totalCumpl = totalCuotaDisplay > 0 ? (totalEjecDisplay / totalCuotaDisplay) * 100 : 0;

                        row += `
                            <td style="font-weight:700; background:#f1f5f9;">${formatValue(totalCuotaDisplay, kpi)}</td>
                            <td style="font-weight:700; background:#f1f5f9;">${formatValue(totalEjecDisplay, kpi)}</td>
                            <td style="font-weight:700; background:#f1f5f9;"><span class="cumpl-val ${getCumplBadgeClass(totalCumpl, kpi)}">${totalCumpl.toFixed(1)}%</span></td>
                        `;

                        mesesFound.forEach(mes => {
                            const mCell = kpiData.meses[mes];
                            if (mCell && mCell.cuota > 0) {
                                const cumplPct = (mCell.ejecutado / mCell.cuota) * 100;
                                row += `<td><span class="cumpl-val ${getCumplBadgeClass(cumplPct, kpi)}">${cumplPct.toFixed(1)}%</span></td>`;
                            } else {
                                row += `<td>-</td>`;
                            }
                        });
                    } else {
                        row += `<td>-</td><td>-</td><td>-</td>`;
                        mesesFound.forEach(() => row += `<td>-</td>`);
                    }

                    tbody.innerHTML += row + `</tr>`;
                });
            });
        }

        function resetFilters() {
            document.getElementById('f-regional').value = '';
            document.getElementById('f-cargo').value = '';
            document.getElementById('f-desarrollador').value = '';
            setSmartDefaultFilters();
            onFilterChange();
        }

        function downloadExcel() {
            const worksheet = XLSX.utils.json_to_sheet(rawData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "KPIs Nestlé");
            XLSX.writeFile(workbook, "Base_KPIs_Manpower_Nestle.xlsx");
        }

        function initApp() {
            updateAllSelects();
            setSmartDefaultFilters();
            onFilterChange();
        }
    </script>
</body>
